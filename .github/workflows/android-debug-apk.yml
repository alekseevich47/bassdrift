# Bass Drift — export a sideloadable debug APK for phone testing.
# Uses barichello/godot-ci (Godot 4.3 + export templates). Debug signing only;
# no production secrets required.

name: Android Debug APK

on:
  push:
    branches:
      - "cursor/bass-drift-game-48ce"
      - "cursor/bass-drift-apk-ci-48ce"
      - "cursor/**-48ce"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_PRESET: "Android"
  EXPORT_NAME: bass-drift-debug
  PROJECT_PATH: "."

jobs:
  export-android-debug:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require Godot project
        run: |
          set -euo pipefail
          if [ ! -f "${PROJECT_PATH}/project.godot" ]; then
            echo "::error::project.godot missing — wait for the game agent to land the Godot project, then re-run."
            exit 1
          fi
          if [ ! -f "${PROJECT_PATH}/export_presets.cfg" ]; then
            echo "::error::export_presets.cfg missing."
            exit 1
          fi
          echo "Found project.godot and export_presets.cfg"
          grep -E 'config/name|run/main_scene|config/features' "${PROJECT_PATH}/project.godot" || true

      - name: Setup Godot editor settings + templates
        run: |
          set -euo pipefail
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
              ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          else
            echo "::error::Export templates for ${GODOT_VERSION}.stable not found in image."
            ls -la /root/.local/share/godot/export_templates/ || true
            exit 1
          fi
          # Ensure Java SDK path is present for Android export (godot-ci image).
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          mkdir -p "$(dirname "$SETTINGS")"
          if [ ! -f "$SETTINGS" ]; then
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' > "$SETTINGS"
          fi
          if ! grep -q 'export/android/java_sdk_path' "$SETTINGS" 2>/dev/null; then
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi

      - name: Generate debug keystore
        id: keystore
        run: |
          set -euo pipefail
          chmod +x android/ci/generate-debug-keystore.sh
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/ci/bass-drift-debug.keystore"
          android/ci/generate-debug-keystore.sh "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Generated debug keystore at $KEYSTORE_PATH"

      - name: Import project
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          # First pass creates .godot/ and imports resources (may exit non-zero once).
          godot --headless --verbose --import || true
          godot --headless --verbose --editor --quit-after 1 || true

      - name: Export debug APK
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ steps.keystore.outputs.path }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          OUT="${EXPORT_DIR}/${EXPORT_NAME}.apk"
          echo "Exporting preset '${EXPORT_PRESET}' -> ${OUT}"
          godot --headless --verbose --export-debug "${EXPORT_PRESET}" "${OUT}"
          if [ ! -f "${OUT}" ]; then
            echo "::error::APK was not produced at ${OUT}"
            ls -laR build/android || true
            exit 1
          fi
          ls -lh "${OUT}"
          # Sanity: APK is a ZIP
          file "${OUT}" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bass-drift-debug.apk
          path: build/android/bass-drift-debug.apk
          if-no-files-found: error
          retention-days: 14
