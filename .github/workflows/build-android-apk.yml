name: Build Android APK

on:
  push:
    branches:
      - cursor/apex-beat-touge-drift-4b39
  workflow_dispatch:

concurrency:
  group: apex-beat-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Export debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GODOT_VERSION: "4.3"
      GODOT_RELEASE: "4.3-stable"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package was removed from sdkmanager.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;23.2.8568313 cmake;3.10.2.4988404"
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK packages
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/platforms/android-34"
          test -d "${ANDROID_HOME}/build-tools/34.0.0"
          test -d "${ANDROID_HOME}/ndk/23.2.8568313"
          echo "Android SDK ready at ${ANDROID_HOME}"

      - name: Install Godot 4.3 and export templates
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -q -O /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot"/Godot_v${GODOT_RELEASE}_linux.x86_64
          sudo ln -sf "$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          wget -q -O /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"
          godot --version

      - name: Point Godot at the Android SDK and debug keystore
        run: |
          set -euo pipefail
          export ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -n "$ANDROID_SDK"
          test -f "$GITHUB_WORKSPACE/keys/debug.keystore"
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path
          text = textwrap.dedent(
              f"""\
              [gd_resource type="EditorSettings" format=3]

              [resource]
              export/android/android_sdk_path = "{os.environ['ANDROID_SDK']}"
              export/android/java_sdk_path = "{os.environ['JAVA_HOME']}"
              export/android/debug_keystore = "{os.environ['GITHUB_WORKSPACE']}/keys/debug.keystore"
              export/android/debug_keystore_user = "androiddebugkey"
              export/android/debug_keystore_pass = "android"
              export/android/shutdown_adb_on_exit = true
              export/android/force_system_user = false
              """
          )
          Path.home().joinpath(".config/godot/editor_settings-4.3.tres").write_text(text)
          PY

      - name: Import project and smoke-check
        run: |
          set -euo pipefail
          godot --headless --path . --import
          godot --headless --path . --rendering-driver opengl3 --rendering-method gl_compatibility -- --smoke

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --verbose --install-android-build-template --export-debug "Android" "build/apex-beat-debug.apk"
          test -f build/apex-beat-debug.apk
          ls -lh build/apex-beat-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-beat-debug.apk
          path: build/apex-beat-debug.apk
          if-no-files-found: error
          compression-level: 0
